name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS only: the native deps (uiohook, sharp, onnxruntime) have no Linux prebuilds here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
